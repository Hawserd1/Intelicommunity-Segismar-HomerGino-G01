{% extends "base.html" %}

{% block title %}Create account | Intelicommunity{% endblock %}

{% block content %}
    <section class="form-panel">
        <p class="eyebrow">COME ON IN</p>
        <h1>Make room for good ideas.</h1>
        <p class="form-intro">Create your account and find conversations worth having.</p>
        <form method="post" class="account-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="button" type="submit">Create my account</button>
        </form>
        <p class="form-footnote">Already part of the community? <a href="{% url 'accounts:login' %}">Log in</a>.</p>
    </section>
{% endblock %}
